<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>AfriAsso Maker - Kaw Ly</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b6b2e"><link rel="apple-touch-icon" href="icon-192.png">
<style id="css">
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f1f7ef;--card:#fff;--tx:#17301f;--mu:#667a6c;--bd:#dcebd9;--p:#0b6b2e;--a:#f58a1f;--sh:0 6px 18px rgba(11,107,46,.13)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#e7f4e2,#fff8ee 60%);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:780px;margin:0 auto;padding:14px}
.brand{text-align:center}.brand img{width:150px;height:150px;object-fit:contain;border-radius:20px}
.brand h1{margin:2px 0;font-size:24px;color:#0b5d2a}.brand h1 span{color:#f58a1f}
.slogan{display:inline-block;background:#e6f3e0;border-radius:99px;padding:6px 14px;font-weight:600;font-size:13px;margin:4px 0 8px}
h2{font-size:17px;margin:0 0 10px}.mu{color:var(--mu);font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:12px 0;box-shadow:var(--sh)}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:#fbfdfa;color:var(--tx);font:inherit}
input[type=color]{height:42px;padding:3px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{background:linear-gradient(135deg,var(--p),#17933f);color:#fff;border:0;border-radius:11px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 3px 8px rgba(11,107,46,.25)}
.btn.s{background:#fff;color:var(--p);border:1px solid var(--p);box-shadow:none}.btn.sm{padding:6px 10px;font-size:13px}
.btn.a{background:linear-gradient(135deg,#f58a1f,#fbb017);color:#2b1a00}.btn.d{background:#fff;color:#c0392b;border:1px solid #c0392b;box-shadow:none}
.acts{display:flex;gap:8px;flex-wrap:wrap}.acts .btn{flex:1;min-width:140px}
.tabs{display:flex;gap:8px;margin:10px 0}.tabs button{flex:1}
.seg{display:flex;gap:8px}.seg label{flex:1;margin:0;border:1px solid var(--bd);border-radius:10px;padding:10px;color:var(--tx);cursor:pointer;background:#fff}.seg input{width:auto;margin-right:6px}
#app{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:10;padding-top:env(safe-area-inset-top,0px)}#app.on{display:flex}
.top{background:linear-gradient(135deg,var(--p),var(--p));color:#fff;padding:10px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;box-shadow:0 3px 10px rgba(0,0,0,.2);border-bottom:4px solid var(--a)}
.top img{width:36px;height:36px;border-radius:8px;object-fit:cover;background:#fff}.top b{flex:1 1 150px;font-size:13px;min-width:0}
.top select{width:auto;max-width:130px;padding:5px;font-size:12px}.top .btn{background:rgba(255,255,255,.22);box-shadow:none;padding:6px 10px;font-size:12px}
.tag{background:var(--a);color:#222;font-size:10px;padding:2px 7px;border-radius:99px;font-weight:800}
#main{flex:1;overflow:auto;padding:14px;max-width:780px;width:100%;margin:0 auto}
nav{display:flex;overflow-x:auto;background:#fff;border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;min-width:74px;border:0;background:none;color:var(--mu);padding:10px 4px;font:inherit;font-size:12px;cursor:pointer;border-top:3px solid transparent}
nav button.on{color:var(--p);border-top-color:var(--a);font-weight:700}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}.item:last-child{border:0}
.empty{text-align:center;color:var(--mu);padding:20px 8px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi div{background:linear-gradient(160deg,#fff,var(--bg));border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center;font-size:12px}.kpi b{display:block;font-size:16px;color:var(--p)}
.in{color:#198754}.out{color:#c0392b}.ro{background:#fff4e0;border-radius:10px;padding:8px;font-size:13px;margin:8px 0}
.amb{color:#c47a00}.seg.w{flex-wrap:wrap}.seg.w label{min-width:46%}
@media(min-width:900px){.wrap{max-width:960px}#app.on{display:grid;grid-template-columns:230px 1fr;grid-template-rows:auto 1fr}.top{grid-column:1/3}nav{grid-column:1;grid-row:2;flex-direction:column;border-top:0;border-inline-end:1px solid var(--bd);padding:10px 0;overflow-y:auto}nav button{text-align:start;padding:13px 20px;font-size:14px;border-top:0;border-inline-start:4px solid transparent;flex:none}nav button.on{border-inline-start-color:var(--a);background:var(--bg)}#main{grid-column:2;grid-row:2;max-width:none;padding:22px 32px}#main>.card,#main>.ro{max-width:960px}.kpi b{font-size:22px}}
pre{white-space:pre-wrap;overflow-x:auto;background:#10261a;color:#d8f3d0;padding:10px;border-radius:10px;font-size:11px;max-height:300px}
</style></head><body>

<!-- ÉCRAN DE VERROUILLAGE / ACCÈS ADMINISTRATEUR -->
<div id="gate" style="position:fixed;inset:0;z-index:60;background:#f1f7ef;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;font-family:system-ui,sans-serif;color:#17301f">
  <div class="card" style="width:100%;max-width:380px;text-align:left;">
    <div style="text-align:center;margin-bottom:12px;">
      <b style="font-size:18px;color:#0b5d2a;">F.K.C.S.</b>
      <p class="mu" style="margin:2px 0 0;">Fedde Kawral Commune de Sagné</p>
    </div>
    <h2 style="font-size:15px;margin-bottom:8px;">Accès Administrateur</h2>
    <label for="admin-pass">Mot de passe organisateur :</label>
    <input type="password" id="admin-pass" placeholder="••••••••" style="margin-bottom:8px;">
    <p id="err-msg" style="color:#c0392b;font-size:12px;margin:4px 0 10px;display:none;">Mot de passe incorrect ou connexion impossible</p>
    <button class="btn" id="unlock-btn" style="width:100%;margin-top:4px;">Déverrouiller</button>
  </div>
</div>

<template id="tpl"><div id="app"><div class="top"><img id="tl" alt=""><b id="tn"></b><select id="lg"><option value="fr">FR</option><option value="en">EN</option><option value="ar">AR</option></select><select id="role" title="Simuler un rôle"></select><button class="btn" id="sc">Sauvegarder</button><span class="tag">MAQUETTE</span><button class="btn" id="back">Quitter</button></div><div id="main"></div><nav id="nav"></nav></div></template>

<script>
  document.getElementById('unlock-btn').addEventListener('click', function() {
    const val = document.getElementById('admin-pass').value.trim();
    if (val === 'FKCS2027' || val === 'FKCS2027GUEST') {
      document.getElementById('gate').style.display = 'none';
    } else {
      document.getElementById('err-msg').style.display = 'block';
    }
  });

  // Valider aussi avec la touche Entrée
  document.getElementById('admin-pass').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      document.getElementById('unlock-btn').click();
    }
  });
</script>
